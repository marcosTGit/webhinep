# version: "3.9"

services:
  ct-sistema-salud:
    build:
      context: .
      dockerfile: Dockerfile
    command: >
      gunicorn hinep.wsgi:application
      --bind 0.0.0.0:8000
      --workers 3
      --access-logfile -
      --error-logfile -
      --log-level info
    # command: gunicorn django_app.wsgi:application --bind 0.0.0.0:8000
    # command: >
    #   sh -c "python manage.py collectstatic --noinput &&
    #     gunicorn delparque.wsgi:application --bind 0.0.0.0:5500"
    hostname: webhinep
    container_name: "ct-sistema-salud"
    volumes:
      - statics_files:/app/project/static
      - media_files:/app/project/media
    ports:
      - "8006:8000"
    env_file:
      - .env

networks:
  default:
    external: true
    name: staging-network

volumes:
  statics_files:
    external: true
  media_files:
    external: true
